# Zeroth on Postgres. `docker compose up` then seed once:
#   docker compose run --rm zeroth zeroth-core seed-demo
#
# Set ZEROTH_SERVICE_API_KEYS_JSON (and provider keys like OPENAI_API_KEY)
# in an .env file next to this compose file.

services:
  zeroth:
    image: zeroth-core:${ZEROTH_IMAGE_TAG:-0.20.1.4.1}
    build:
      context: .
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp
    volumes:
      - zeroth-data:/data
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    environment:
      ZEROTH_DATABASE__BACKEND: postgres
      ZEROTH_DATABASE__POSTGRES_DSN: postgresql://zeroth:zeroth@db:5432/zeroth
      ZEROTH_ARTIFACT_STORE__FILESYSTEM_BASE_DIR: /data/artifacts
      ZEROTH_SERVICE_API_KEYS_JSON: ${ZEROTH_SERVICE_API_KEYS_JSON:-}
      SIGNING_DEPLOYMENT: ${SIGNING_DEPLOYMENT:-}
      ZEROTH_LANGGRAPH_GATEWAY__ENABLED: "true"
      ZEROTH_LANGGRAPH_GATEWAY__UPSTREAM_URL: ${ZEROTH_LANGGRAPH_GATEWAY_UPSTREAM_URL:-http://langgraph-fixture:8123}
      ZEROTH_LANGGRAPH_GATEWAY__UPSTREAM_AUDIENCE: ${ZEROTH_LANGGRAPH_GATEWAY_UPSTREAM_AUDIENCE:-langgraph-fixture}
      ZEROTH_LANGGRAPH_GATEWAY__DEPLOYMENT_REF: ${ZEROTH_LANGGRAPH_GATEWAY_DEPLOYMENT_REF:-default}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      langgraph-fixture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4)); assert p['status'] in ('ok','degraded') and p['checks']"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  langgraph-fixture:
    image: python:3.12.13-slim-bookworm
    working_dir: /workspace
    command: python release/langgraph/harness.py mock-upstream
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp
    volumes:
      - .:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8123/ok',timeout=2))['ok']"]
      interval: 2s
      timeout: 3s
      retries: 15

  db:
    image: postgres:16.9-bookworm
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_USER: zeroth
      POSTGRES_PASSWORD: zeroth
      POSTGRES_DB: zeroth
    volumes:
      - zeroth-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroth"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  zeroth-data:
  zeroth-pg:
