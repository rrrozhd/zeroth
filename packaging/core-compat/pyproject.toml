[project]
name = "zeroth-core"
version = "0.25.9.4"
description = "Compatibility package for the renamed zeroth-platform distribution"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "zeroth-platform==0.25.9.4",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://rrrozhd.github.io/zeroth/"
Documentation = "https://rrrozhd.github.io/zeroth/"
Source = "https://github.com/rrrozhd/zeroth"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md"]
