[project]
name = "zeroth-sdk"
version = "0.0.0.dev0"
description = "Unreleased protocol prototype for the Zeroth economic debugger"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["zeroth", "agents", "economics", "optimization", "backtesting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://rrrozhd.github.io/zeroth/"
Documentation = "https://rrrozhd.github.io/zeroth/"
Source = "https://github.com/rrrozhd/zeroth"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/zeroth/instrumentation",
    "src/zeroth/protocol",
    "src/zeroth/sdk",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/zeroth", "README.md"]

[tool.zeroth.release]
publish = false
reason = "No supported production hosted endpoint, managed provider credentials, or release"
