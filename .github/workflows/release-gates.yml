name: Release gates

# The complete gate matrix, run nightly so drift surfaces before a release is
# cut, and on demand for a release candidate.
#
# This workflow deliberately has no `pull_request` trigger. Pull requests keep
# the fast checks in ci.yml and langgraph-compatibility.yml; the expensive
# matrix belongs to candidates, not to every push. tests/release_gates
# asserts that property rather than trusting this comment.
#
# Every job emits a machine-readable record bound to the candidate's measured
# identity. The evidence gate validates those records and fails closed: a
# record that is absent, stale, incomplete, bound to another build, or
# reporting failure blocks the run.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # The release pipeline calls this workflow so the candidate-level gates are
  # produced once and validated in both places, rather than duplicated as YAML
  # that can drift.
  workflow_call:
    inputs:
      dist_artifact:
        description: >-
          Name of an already-built dist artifact to measure instead of building
          one. A release must bind its evidence to the artifacts it actually
          publishes, and two independent builds do not produce identical bytes,
          so the caller passes its own build rather than letting this workflow
          make a second one that would read as `mismatched`.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  candidate:
    name: Measure the candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        if: inputs.dist_artifact == ''
        run: uv build

      - name: Reuse the caller's already-built dist
        if: inputs.dist_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist_artifact }}
          path: dist

      - name: Measure candidate identity
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          for artifact in dist/*; do
            ARGS+=(--artifact "$(basename "${artifact}")=${artifact}")
          done
          python release/gates/cli.py identity \
            "${ARGS[@]}" \
            --compatibility release/langgraph/compatibility.json \
            --output release/evidence/candidate-identity.json
          cat release/evidence/candidate-identity.json

      - name: Upload candidate identity
        uses: actions/upload-artifact@v4
        with:
          name: candidate-identity
          path: release/evidence/candidate-identity.json

      - name: Upload dist
        if: inputs.dist_artifact == ''
        uses: actions/upload-artifact@v4
        with:
          name: gate-dist
          path: dist/

  source:
    name: Gate — source
    needs: [candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity
          path: release/evidence

      - name: Run the source checks and record the outcome
        shell: bash
        run: |
          set -uo pipefail
          # GitHub's `shell: bash` already runs with `-e`, and `set -uo pipefail`
          # does not clear it: the first failing command aborts the step before its
          # `VAR=$?` capture runs, so every captured status could only ever be 0 and
          # the recorded result was decided by whichever command failed first.
          set +e
          mkdir -p release/evidence
          uv sync --all-groups --all-extras
          uv run ruff check src tests; RUFF=$?
          uv run pytest -q --junitxml=release/evidence/source-junit.xml; PYTEST=$?
          uv run interrogate src/zeroth; INTERROGATE=$?
          (cd frontend && npm ci --no-fund --no-audit) ; NPM_CI=$?
          (cd frontend && npx vitest run --reporter=junit \
            --outputFile=../release/evidence/source-ui-junit.xml); VITEST=$?
          (cd frontend && npm run check:api); API=$?
          set -e
          status() { if [ "$1" -eq 0 ]; then echo passed; else echo failed; fi; }
          # npm ci failing means the console suite never ran; that is a failed
          # UI result, not a passed one.
          if [ "${NPM_CI}" -ne 0 ]; then VITEST=1; fi
          python release/gates/cli.py record --gate source \
            --identity release/evidence/candidate-identity.json \
            --result "ruff=$(status ${RUFF})" \
            --result "pytest=$(status ${PYTEST})" \
            --result "interrogate=$(status ${INTERROGATE})" \
            --result "frontend-unit=$(status ${VITEST})" \
            --result "frontend-api-contract=$(status ${API})" \
            --kind junit=release/evidence/source-junit.xml \
            --kind ui=release/evidence/source-ui-junit.xml \
            --output release/evidence/source.json
          cat release/evidence/source.json

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-source
          path: release/evidence/source*

  package:
    name: Gate — package
    needs: [candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On the runner, not in the wheel venv. tests/architecture/test_wheel_packaging.py
      # shells out to `uv build` to inspect what the distribution actually ships --
      # the most on-topic check this gate has -- and errored with
      # `FileNotFoundError: uv` on every nightly because this was the one gate job
      # that did not install it. The venv below stays wheel-only.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity
          path: release/evidence

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist_artifact != '' && inputs.dist_artifact || 'gate-dist' }}
          path: dist

      - name: Install the built wheel and record the outcome
        shell: bash
        run: |
          set -uo pipefail
          # GitHub's `shell: bash` already runs with `-e`, and `set -uo pipefail`
          # does not clear it: the first failing command aborts the step before its
          # `VAR=$?` capture runs, so every captured status could only ever be 0 and
          # the recorded result was decided by whichever command failed first.
          set +e
          mkdir -p release/evidence
          WHEEL=$(ls dist/zeroth_core-*.whl | head -1)
          python -m venv /tmp/gate-venv
          # shellcheck disable=SC1091
          source /tmp/gate-venv/bin/activate
          pip install --upgrade pip >/dev/null
          test -f "${WHEEL}"; BUILD=$?
          pip install "${WHEEL}[all,langgraph]" pytest pytest-asyncio \
            "testcontainers[postgres]"; INSTALL=$?
          python -c "import zeroth.runtime; print(zeroth.runtime.__path__)"; SMOKE=$?
          if [ "${INSTALL}" -ne 0 ]; then SMOKE=1; fi
          pip install "${WHEEL}[memory-pg,memory-chroma,memory-es,dispatch,sandbox]"; EXTRAS=$?
          # `-m` on the command line REPLACES pyproject's addopts expression, it
          # does not add to it. `-m "not live"` therefore re-selected the
          # langgraph_conformance and deployed_acceptance markers the project
          # deselects by default: 84 of this job's 96 errors were Agent Server
          # startup failures for a server the wheel venv has no reason to run.
          # Every marker the default excludes is repeated here, plus the
          # dev_toolchain marker for tools a wheel venv omits by design.
          # tests/release_gates/test_marker_integrity.py executes this expression
          # and asserts it admits nothing the project default excludes.
          pytest tests/ -q \
            -m "not live and not langgraph_conformance and not deployed_acceptance and not dev_toolchain" \
            --junitxml=release/evidence/package-junit.xml; TESTS=$?
          deactivate
          set -e
          status() { if [ "$1" -eq 0 ]; then echo passed; else echo failed; fi; }
          python release/gates/cli.py record --gate package \
            --identity release/evidence/candidate-identity.json \
            --result "build=$(status ${BUILD})" \
            --result "smoke-install=$(status ${SMOKE})" \
            --result "extras=$(status ${EXTRAS})" \
            --result "wheel-tests=$(status ${TESTS})" \
            --kind junit=release/evidence/package-junit.xml \
            --output release/evidence/package.json
          cat release/evidence/package.json

      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-package
          path: release/evidence/package*

  langgraph:
    name: Gate — LangGraph
    needs: [candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity
          path: release/evidence

      - name: Run conformance and benchmark, and record the outcome
        shell: bash
        run: |
          set -uo pipefail
          # GitHub's `shell: bash` already runs with `-e`, and `set -uo pipefail`
          # does not clear it: the first failing command aborts the step before its
          # `VAR=$?` capture runs, so every captured status could only ever be 0 and
          # the recorded result was decided by whichever command failed first.
          set +e
          mkdir -p release/evidence
          uv run --frozen --group gateway-conformance pytest -o addopts= -q \
            -m langgraph_conformance tests/langgraph_gateway/conformance \
            --junitxml=release/evidence/langgraph-junit.xml; CONFORMANCE=$?
          uv run python release/langgraph/harness.py validate --phase source \
            --manifest release/langgraph/release-manifest.json; MATRIX=$?
          uv run python release/langgraph/harness.py benchmark \
            --output release/evidence/langgraph-benchmark.json; BENCH=$?
          # The legacy harness validates its manifest against CURRENT_RELEASE,
          # a hand-edited constant, so it cannot notice that its evidence
          # describes an older release than the candidate. Cross-check the
          # declared release against the measured one, otherwise this gate
          # would report compatibility "passed" using stale evidence -- the
          # exact defect this ticket exists to close.
          COMPAT=$(python -c "import json;print(json.load(open('release/langgraph/compatibility.json'))['release'])")
          MEASURED=$(python -c "import json;print(json.load(open('release/evidence/candidate-identity.json'))['package']['version'])")
          echo "compatibility evidence: ${COMPAT}; candidate: ${MEASURED}"
          [ "${COMPAT}" = "${MEASURED}" ]; CURRENT=$?
          # Everything the record cites must travel with it, so copy the
          # committed compatibility set into the evidence directory.
          cp release/langgraph/compatibility.json release/evidence/langgraph-compatibility.json
          set -e
          status() { if [ "$1" -eq 0 ]; then echo passed; else echo failed; fi; }
          python release/gates/cli.py record --gate langgraph \
            --identity release/evidence/candidate-identity.json \
            --result "conformance=$(status ${CONFORMANCE})" \
            --result "compatibility-matrix=$(status ${MATRIX})" \
            --result "compatibility-current=$(status ${CURRENT})" \
            --result "benchmark=$(status ${BENCH})" \
            --kind junit=release/evidence/langgraph-junit.xml \
            --kind compatibility=release/evidence/langgraph-compatibility.json \
            --kind benchmark=release/evidence/langgraph-benchmark.json \
            --output release/evidence/langgraph.json
          cat release/evidence/langgraph.json

      - name: Upload LangGraph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-langgraph
          path: release/evidence/langgraph*

  untrusted-code:
    name: Gate — untrusted code
    needs: [candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity
          path: release/evidence

      - name: Prove the sandbox still refuses, and record the outcome
        shell: bash
        run: |
          set -uo pipefail
          # GitHub's `shell: bash` already runs with `-e`, and `set -uo pipefail`
          # does not clear it: the first failing command aborts the step before its
          # `VAR=$?` capture runs, so every captured status could only ever be 0 and
          # the recorded result was decided by whichever command failed first.
          set +e
          mkdir -p release/evidence
          uv sync --all-groups --all-extras
          run_suite() {
            uv run pytest -q "$1" --junitxml="$2"
          }
          run_suite tests/integrations/test_sandbox_surface.py \
            release/evidence/untrusted-surface.xml; SURFACE=$?
          run_suite tests/execution_units/test_sandbox_hardening.py \
            release/evidence/untrusted-hardening.xml; HARDENING=$?
          run_suite tests/execution_units/test_sandbox_strict_network.py \
            release/evidence/untrusted-network.xml; NETWORK=$?
          run_suite tests/sandbox_sidecar \
            release/evidence/untrusted-code-junit.xml; SIDECAR=$?
          set -e
          status() { if [ "$1" -eq 0 ]; then echo passed; else echo failed; fi; }
          python release/gates/cli.py record --gate untrusted-code \
            --identity release/evidence/candidate-identity.json \
            --result "sandbox-surface=$(status ${SURFACE})" \
            --result "sandbox-hardening=$(status ${HARDENING})" \
            --result "sandbox-strict-network=$(status ${NETWORK})" \
            --result "sidecar-executor=$(status ${SIDECAR})" \
            --kind junit=release/evidence/untrusted-code-junit.xml \
            --output release/evidence/untrusted-code.json
          cat release/evidence/untrusted-code.json

      - name: Upload untrusted-code evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-untrusted-code
          path: release/evidence/untrusted*

  security-regression:
    name: Gate — security regression
    needs: [candidate]
    runs-on: ubuntu-latest
    env:
      ZEROTH_TEST_REDIS_URL: redis://localhost:6379/15
      ZEROTH_SECURITY_CANARIES: '["zeroth-security-regression-canary-7f3a"]'
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity
          path: release/evidence

      - name: Run the complete matrix and always record every independent result
        shell: bash
        run: |
          # GitHub invokes bash with -e. Disable it explicitly so a failed test,
          # verifier, or scanner cannot prevent the candidate-bound record from
          # being emitted and retained for diagnosis.
          set +e
          set -uo pipefail
          mkdir -p release/evidence
          uv sync --all-groups --all-extras
          uv run python -m release.security.pytest_gate \
            --matrix release/security/security-matrix.json \
            --tier release-candidate \
            --results release/evidence/security-rc-outcomes.json \
            --junitxml release/evidence/security-rc-junit.xml \
            --pytest-arg=-q
          SECURITY_GATE_RC=$?
          uv run python -m release.security.matrix verify-coverage \
            --tier release-candidate \
            --outcomes release/evidence/security-rc-outcomes.json \
            --output release/evidence/security-coverage.json
          COVERAGE_RC=$?
          uv run python -m release.security.matrix verify-outcomes \
            --tier release-candidate \
            --outcomes release/evidence/security-rc-outcomes.json \
            --output release/evidence/security-outcome-verdict.json
          OUTCOME_RC=$?
          uv run python -m release.security.scan release/evidence \
            --output release/evidence/security-scan.json
          SCAN_RC=$?

          status() { if [ "$1" -eq 0 ]; then echo passed; else echo failed; fi; }
          python release/gates/cli.py record --gate security-regression \
            --identity release/evidence/candidate-identity.json \
            --result "security-matrix=$(status ${SECURITY_GATE_RC})" \
            --result "coverage-complete=$(status ${COVERAGE_RC})" \
            --result "distributed-no-skips=$(status ${OUTCOME_RC})" \
            --result "credential-scan=$(status ${SCAN_RC})" \
            --kind junit=release/evidence/security-rc-junit.xml \
            --kind security=release/evidence/security-scan.json \
            --output release/evidence/security-regression.json
          RECORD_RC=$?
          cat release/evidence/security-regression.json
          if [ "${SECURITY_GATE_RC}" -ne 0 ] || [ "${COVERAGE_RC}" -ne 0 ] || \
             [ "${OUTCOME_RC}" -ne 0 ] || [ "${SCAN_RC}" -ne 0 ] || \
             [ "${RECORD_RC}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload security regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-security-regression
          path: |
            release/evidence/security-rc-junit.xml
            release/evidence/security-rc-outcomes.json
            release/evidence/security-coverage.json
            release/evidence/security-outcome-verdict.json
            release/evidence/security-scan.json
            release/evidence/security-regression.json

  load-recovery:
    name: Gate — load and recovery
    needs: [candidate]
    runs-on: ubuntu-24.04-arm
    container:
      image: python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
      options: --cpus 2 --memory 8g
    env:
      ZEROTH_LOAD_POSTGRES_DSN: postgresql://zeroth:zeroth@postgres:5432/zeroth
      ZEROTH_LOAD_REDIS_URL: redis://redis:6379/14
      ZEROTH_LOAD_OBSERVATIONS: release/evidence/load-recovery-raw.json
      ZEROTH_TEST_REDIS_URL: redis://redis:6379/15
      ZEROTH_LOAD_RUNTIME_IMAGE: python:3.12.13-slim-bookworm@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
      ZEROTH_LOAD_POSTGRES_VERSION: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
      ZEROTH_LOAD_REDIS_VERSION: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: zeroth
          POSTGRES_PASSWORD: zeroth
          POSTGRES_DB: zeroth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeroth -d zeroth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity
          path: release/evidence

      - name: Run product profiles and record every independent result
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p release/evidence
          uv sync --frozen --all-groups --all-extras
          uv run pytest -q tests/load_release/test_profiles.py \
            tests/load_release/test_report.py \
            tests/load_release/test_product_profiles.py \
            tests/acceptance/test_ephemeral_candidate.py \
            tests/service/test_guardrails_api.py \
            tests/security/distributed/test_postgres_tenant_isolation.py \
            tests/security/distributed/test_redis_artifact_isolation.py \
            --junitxml=release/evidence/load-recovery-junit.xml
          PRODUCT=$?
          uv run python release/load/harness.py run \
            --profiles release/load/profiles-v1.json \
            --baseline release/load/baseline-v1.json \
            --identity release/evidence/candidate-identity.json \
            --observations release/evidence/load-recovery-raw.json \
            --output release/evidence/load-recovery-benchmark.json
          REPORT=$?
          status() { if [ "$1" -eq 0 ]; then echo passed; else echo failed; fi; }
          python release/gates/cli.py record --gate load-recovery \
            --identity release/evidence/candidate-identity.json \
            --result "profiles=$(status ${PRODUCT})" \
            --result "thresholds=$(status ${REPORT})" \
            --result "recovery=$(status ${PRODUCT})" \
            --result "accepted-run-integrity=$(status ${REPORT})" \
            --kind benchmark=release/evidence/load-recovery-benchmark.json \
            --kind junit=release/evidence/load-recovery-junit.xml \
            --output release/evidence/load-recovery.json
          RECORD=$?
          cat release/evidence/load-recovery.json
          if [ "${PRODUCT}" -ne 0 ] || [ "${REPORT}" -ne 0 ] || [ "${RECORD}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload load and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-load-recovery
          path: release/evidence/load-recovery*
          retention-days: 30

  evidence-gate:
    name: Validate evidence and publish the verdict
    needs: [candidate, source, package, langgraph, untrusted-code, security-regression, load-recovery]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect every gate record
        uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: release/evidence
          merge-multiple: true

      - name: Download candidate identity
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity
          path: release/evidence

      - name: Publish the verdict for the gates this run produces
        shell: bash
        run: |
          set -uo pipefail
          # GitHub's `shell: bash` already runs with `-e`, and `set -uo pipefail`
          # does not clear it: the first failing command aborts the step before its
          # `VAR=$?` capture runs, so every captured status could only ever be 0 and
          # the recorded result was decided by whichever command failed first.
          set +e
          # `--trigger nightly` selects exactly the gates this workflow
          # emits. The release pipeline runs its own full-phase gates on top;
          # this one must not demand evidence it never produces.
          python release/gates/cli.py verdict \
            --identity release/evidence/candidate-identity.json \
            --phase candidate \
            --trigger nightly \
            --output release/evidence/VERDICT.md; VERDICT=$?
          cat release/evidence/VERDICT.md >> "${GITHUB_STEP_SUMMARY}"
          exit "${VERDICT}"

      - name: Retain the evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-gate-evidence-bundle
          path: release/evidence
          retention-days: 90
