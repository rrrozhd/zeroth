name: Verify extras

# Continuous verification that every declared optional extra resolves and
# installs cleanly, and that the modules gated behind each extra import
# successfully. Gate for PKG-03 per Phase 28 D-04.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-extras:
    name: "extra=${{ matrix.extra }}"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra:
          - memory-pg
          - memory-chroma
          - memory-es
          - dispatch
          - sandbox
          - all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build

      - name: Clean-venv install extra and import smoke
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/zeroth_core-*.whl | head -1)
          echo "Using wheel: ${WHEEL}"
          VENV="/tmp/venv-${{ matrix.extra }}"
          python -m venv "${VENV}"
          # shellcheck disable=SC1090
          source "${VENV}/bin/activate"
          pip install --upgrade pip
          pip install "${WHEEL}[${{ matrix.extra }}]"
          case "${{ matrix.extra }}" in
            memory-pg)
              python -c "import zeroth.integrations.memory.pgvector_connector; print('memory-pg OK')"
              ;;
            memory-chroma)
              python -c "import zeroth.integrations.memory.chroma_connector; print('memory-chroma OK')"
              ;;
            memory-es)
              python -c "import zeroth.integrations.memory.elastic_connector; print('memory-es OK')"
              ;;
            dispatch)
              python -c "import arq, redis, zeroth.platform.dispatch.arq_wakeup; print('dispatch OK')"
              ;;
            sandbox)
              # [sandbox] extra is intentionally empty (sandbox_sidecar shells
              # out to docker CLI at runtime). Gate is: install resolves and
              # the module imports from base deps only.
              python -c "import zeroth.integrations.sandbox; print('sandbox OK')"
              ;;
            all)
              python -c "import arq, redis, zeroth.platform.dispatch.arq_wakeup, zeroth.integrations.memory.pgvector_connector, zeroth.integrations.memory.chroma_connector, zeroth.integrations.sandbox; print('all OK')"
              ;;
            *)
              echo "::error::Unknown matrix entry: ${{ matrix.extra }}"
              exit 1
              ;;
          esac

  # The [console] extra resolves the separate zeroth-console dist, which is
  # built from this repo (frontend/ + packaging/console) rather than fetched
  # from PyPI — so it gets its own job with a Node toolchain and installs via
  # --find-links against the locally built wheels.
  verify-console-extra:
    name: "extra=console (local dists)"
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build both dists
        shell: bash
        run: |
          set -euo pipefail
          uv build
          (cd frontend && npm ci --no-fund --no-audit && npm run build)
          ./scripts/build_console_dist.sh --skip-frontend-build

      - name: Clean-venv install [console] and mount smoke
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/zeroth_core-*.whl | head -1)
          python -m venv /tmp/venv-console
          # shellcheck disable=SC1090
          source /tmp/venv-console/bin/activate
          pip install --upgrade pip
          pip install --find-links dist/ "${WHEEL}[console]"
          cd /tmp  # away from the checkout so the repo fallback can't mask the package
          python -c "
          from fastapi import FastAPI
          from zeroth.service.api.console_ui import find_console_dir, mount_console
          d = find_console_dir()
          assert d is not None and 'zeroth_console' in str(d), f'console dir: {d}'
          assert mount_console(FastAPI()) is True
          print('console extra OK:', d)
          "
