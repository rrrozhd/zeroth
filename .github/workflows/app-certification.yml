name: Certify Zeroth application
on:
  workflow_call:
    inputs:
      zeroth_ref:
        description: Immutable Zeroth commit to certify against
        required: true
        type: string
      declaration_path:
        description: App-relative certification declaration
        required: true
        type: string
  workflow_dispatch:
    inputs:
      zeroth_ref:
        description: Immutable Zeroth commit to certify against
        required: true
        type: string
      declaration_path:
        description: App-relative certification declaration
        required: true
        type: string
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout application candidate
        id: app-checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - name: Checkout pinned Zeroth certifier
        id: certifier-checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrozhd/zeroth
          ref: ${{ inputs.zeroth_ref }}
          path: zeroth
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Validate pins and prepare isolated app environment
        id: prepare
        shell: bash
        env:
          DECLARATION_PATH: ${{ inputs.declaration_path }}
          ZEROTH_REF: ${{ inputs.zeroth_ref }}
        run: |
          set -euo pipefail
          [[ "$ZEROTH_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "zeroth_ref must be a full commit SHA" >&2
            exit 1
          }
          [[ "$DECLARATION_PATH" != /* && "/$DECLARATION_PATH/" != *"/../"* ]] || {
            echo "declaration_path must remain below the app checkout" >&2
            exit 1
          }
          DECLARATION_FILE=$(realpath -e "app/$DECLARATION_PATH")
          [[ "$DECLARATION_FILE" == "$GITHUB_WORKSPACE/app/"* ]] || {
            echo "declaration_path resolves outside the app checkout" >&2
            exit 1
          }
          ZEROTH_COMMIT=$(git -C zeroth rev-parse HEAD)
          [[ "$ZEROTH_COMMIT" == "$ZEROTH_REF" ]] || {
            echo "checked-out certifier does not match zeroth_ref" >&2
            exit 1
          }
          [[ ! -e app/.zeroth-certifier && ! -L app/.zeroth-certifier && \
             ! -e app/.app-certification && ! -L app/.app-certification ]] || {
            echo "reserved certification paths already exist in the app checkout" >&2
            exit 1
          }
          uv sync --directory zeroth --frozen --all-extras
          uv sync --directory app --frozen --all-extras
          mkdir -p app/.zeroth-certifier app/.app-certification
          uv build --directory zeroth --wheel --out-dir app/.zeroth-certifier
          cp zeroth/requirements-image.txt app/.zeroth-certifier/requirements-image.txt
          npm ci --prefix app/frontend
          APP_PYTHON="$GITHUB_WORKSPACE/app/.venv/bin/python"
          [[ -x "$APP_PYTHON" ]] || {
            echo "app uv environment has no Python interpreter" >&2
            exit 1
          }
          export PYTHONPATH="$GITHUB_WORKSPACE/zeroth:$GITHUB_WORKSPACE/app"
          cp "$DECLARATION_FILE" app/.app-certification/declaration.json
          "$APP_PYTHON" -m release.app_certification validate-declaration \
            --declaration "$DECLARATION_FILE"
          DECLARED_VERSION=$("$APP_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["zeroth_version"])' \
            "$DECLARATION_FILE")
          CERTIFIER_VERSION=$("$APP_PYTHON" -c \
            'import sys,tomllib; print(tomllib.load(open(sys.argv[1],"rb"))["project"]["version"])' \
            zeroth/pyproject.toml)
          [[ "$DECLARED_VERSION" == "$CERTIFIER_VERSION" ]] || {
            echo "declaration Zeroth pin does not match checked-out certifier" >&2
            exit 1
          }
          APP_COMMIT=$(git -C app rev-parse HEAD)
          DOCKERFILE=$("$APP_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["dockerfile"])' \
            "$DECLARATION_FILE")
          IMAGE_REFERENCE=$("$APP_PYTHON" -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["image_reference"])' \
            "$DECLARATION_FILE")
          echo "app_commit=$APP_COMMIT" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "image_reference=$IMAGE_REFERENCE" >> "$GITHUB_OUTPUT"
          APP_CERTIFICATION_API_KEY=$("$APP_PYTHON" -c 'import secrets; print(secrets.token_hex(32))')
          echo "::add-mask::$APP_CERTIFICATION_API_KEY"
          echo "APP_CERTIFICATION_API_KEY=$APP_CERTIFICATION_API_KEY" >> "$GITHUB_ENV"
      - name: Build and measure application image
        id: image
        shell: bash
        env:
          DOCKERFILE: ${{ steps.prepare.outputs.dockerfile }}
          IMAGE_REFERENCE: ${{ steps.prepare.outputs.image_reference }}
        run: |
          set -euo pipefail
          docker build --file "app/$DOCKERFILE" --tag "$IMAGE_REFERENCE" app
          IMAGE_DIGEST=$(docker image inspect "$IMAGE_REFERENCE" --format '{{.Id}}')
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "docker returned a non-immutable image digest" >&2
            exit 1
          }
          docker save --output app/.app-certification/image.tar "$IMAGE_REFERENCE"
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX image SBOM
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.prepare.outputs.image_reference }}
          format: spdx-json
          output-file: app/.app-certification/image.spdx.json
          upload-artifact: "false"
      - name: Bind SBOM and provenance predicate to measured candidate
        id: evidence
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/zeroth:${{ github.workspace }}/app
          DECLARATION_PATH: ${{ inputs.declaration_path }}
          APP_COMMIT: ${{ steps.prepare.outputs.app_commit }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          app/.venv/bin/python -m release.app_certification prepare-evidence \
            --declaration "app/$DECLARATION_PATH" \
            --root app \
            --app-commit "$APP_COMMIT" \
            --image-digest "$IMAGE_DIGEST" \
            --raw-sbom app/.app-certification/image.spdx.json
      - name: Start isolated packaged and ephemeral containers
        id: containers
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker network create app-cert-packaged-net
          docker network create app-cert-ephemeral-net
          docker volume create app-cert-packaged-data
          docker run --detach --name app-cert-packaged \
            --network app-cert-packaged-net \
            --mount type=volume,source=app-cert-packaged-data,target=/data \
            --publish 127.0.0.1:18080:8000 \
            --env APP_CERTIFICATION_API_KEY="$APP_CERTIFICATION_API_KEY" \
            "$IMAGE_ID"
          docker run --detach --name app-cert-ephemeral \
            --network app-cert-ephemeral-net \
            --tmpfs /data:rw,noexec,nosuid,size=256m,uid=10001,gid=10001 \
            --publish 127.0.0.1:18081:8000 \
            --env APP_CERTIFICATION_API_KEY="$APP_CERTIFICATION_API_KEY" \
            "$IMAGE_ID"
      - name: Require healthy container state and readiness payload
        id: health
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/zeroth
        run: |
          set -euo pipefail
          wait_healthy() {
            local name="$1" status running
            for _ in {1..90}; do
              running=$(docker inspect --format '{{.State.Running}}' "$name")
              status=$(docker inspect --format '{{.State.Health.Status}}' "$name")
              [[ "$running" == "true" ]] || return 1
              [[ "$status" == "healthy" ]] && return 0
              [[ "$status" != "unhealthy" ]] || return 1
              sleep 2
            done
            return 1
          }
          wait_healthy app-cert-packaged
          wait_healthy app-cert-ephemeral
          app/.venv/bin/python -m release.app_certification probe-readiness \
            --url http://127.0.0.1:18080/health/ready
          app/.venv/bin/python -m release.app_certification probe-readiness \
            --url http://127.0.0.1:18081/health/ready
      - name: Run fail-closed certification
        id: certify
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/zeroth:${{ github.workspace }}/app
          DECLARATION_PATH: ${{ inputs.declaration_path }}
          APP_COMMIT: ${{ steps.prepare.outputs.app_commit }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          app/.venv/bin/python -m release.app_certification run \
            --declaration "app/$DECLARATION_PATH" \
            --root app \
            --app-commit "$APP_COMMIT" \
            --image-digest "$IMAGE_DIGEST" \
            --packaged-url http://127.0.0.1:18080 \
            --ephemeral-url http://127.0.0.1:18081 \
            --report app/.app-certification/report.json
      - name: Finalize canonical report and stage diagnostics
        id: finalizer
        if: ${{ always() }}
        shell: bash
        env:
          APP_CHECKOUT: ${{ steps.app-checkout.outcome }}
          CERTIFIER_CHECKOUT: ${{ steps.certifier-checkout.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          IMAGE: ${{ steps.image.outcome }}
          SBOM: ${{ steps.sbom.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
          CONTAINERS: ${{ steps.containers.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          CERTIFY: ${{ steps.certify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p app/.app-certification
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          stages = {name.lower(): os.environ[name] for name in (
              "APP_CHECKOUT", "CERTIFIER_CHECKOUT", "PREPARE", "IMAGE", "SBOM",
              "EVIDENCE", "CONTAINERS", "HEALTH", "CERTIFY",
          )}
          root = Path("app/.app-certification")
          (root / "workflow-stages.json").write_text(
              json.dumps(stages, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          report = root / "report.json"
          if report.exists():
              raise SystemExit(0)
          checks = (
              "graph", "service-config", "contracts", "dependency-lock",
              "optional-extras", "migrations", "container-startup", "health",
              "policies", "frontend-api", "packaged-smoke", "ephemeral-smoke",
              "sbom", "provenance",
          )
          stage = {
              "container-startup": "containers", "health": "health",
              "packaged-smoke": "certify", "ephemeral-smoke": "certify",
              "sbom": "sbom", "provenance": "evidence",
          }
          payload = {
              "schema_version": 1,
              "status": "failed",
              "candidate": None,
              "checks": [
                  {
                      "name": name,
                      "status": "failed",
                      "detail": f"{name}: workflow stage {stage.get(name, 'prepare')} "
                      f"outcome={stages[stage.get(name, 'prepare')]}",
                  }
                  for name in checks
              ],
              "evidence": None,
          }
          report.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Capture container diagnostics
        id: logs
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p app/.app-certification/logs
          docker logs app-cert-packaged > app/.app-certification/logs/packaged.log 2>&1
          docker logs app-cert-ephemeral > app/.app-certification/logs/ephemeral.log 2>&1
          docker inspect app-cert-packaged app-cert-ephemeral \
            > app/.app-certification/logs/container-inspect.json 2>&1
      - name: Stop and remove certification containers
        id: cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          docker stop app-cert-packaged app-cert-ephemeral
          docker rm app-cert-packaged app-cert-ephemeral
          docker network rm app-cert-packaged-net app-cert-ephemeral-net
          docker volume rm app-cert-packaged-data
      - name: Upload unprivileged certification handoff
        id: diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-certification-handoff-${{ github.run_id }}
          path: app/.app-certification
          if-no-files-found: error
          retention-days: 14
  attest:
    needs: certify
    if: ${{ needs.certify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
      artifact-metadata: write
    steps:
      - name: Checkout pinned Zeroth verifier only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: rrrozhd/zeroth
          ref: ${{ inputs.zeroth_ref }}
          path: zeroth
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Download immutable unprivileged handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-certification-handoff-${{ github.run_id }}
          path: evidence
      - name: Validate handoff without executing candidate code
        id: validate
        shell: bash
        env:
          APP_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv sync --directory zeroth --frozen
          PYTHON="$GITHUB_WORKSPACE/zeroth/.venv/bin/python"
          VERSION=$("$PYTHON" -c \
            'import tomllib; print(tomllib.load(open("zeroth/pyproject.toml","rb"))["project"]["version"])')
          PYTHONPATH="$GITHUB_WORKSPACE/zeroth" "$PYTHON" -m release.app_certification \
            validate-handoff \
            --report evidence/report.json \
            --root evidence/root \
            --image-archive evidence/image.tar \
            --app-commit "$APP_COMMIT" \
            --zeroth-version "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Extract validated custom predicate
        shell: bash
        env:
          PROVENANCE_PATH: ${{ steps.validate.outputs.provenance_path }}
        run: |
          set -euo pipefail
          zeroth/.venv/bin/python -c \
            'import json,pathlib,sys; source=json.load(open(sys.argv[1])); pathlib.Path(sys.argv[2]).write_text(json.dumps(source["predicate"],indent=2,sort_keys=True)+"\n")' \
            "evidence/root/$PROVENANCE_PATH" evidence/attestation-predicate.json
      - name: Attest validated immutable candidate
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.validate.outputs.image_reference }}
          subject-digest: ${{ steps.validate.outputs.image_digest }}
          predicate-type: https://zeroth.dev/app-certification/provenance/v1
          predicate-path: evidence/attestation-predicate.json
      - name: Bind signed provenance into final report
        id: finalize-attestation
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/zeroth
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          zeroth/.venv/bin/python -m release.app_certification finalize-attestation \
            --bundle "$BUNDLE" \
            --report evidence/report.json \
            --root evidence/root
      - name: Record attestation stage outcome
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATE: ${{ steps.validate.outcome }}
          PROVENANCE: ${{ steps.provenance.outcome }}
          FINALIZE: ${{ steps.finalize-attestation.outcome }}
        run: |
          python3 -c 'import json,os,pathlib; pathlib.Path("evidence/attestation-stage.json").write_text(json.dumps({"validate":os.environ["VALIDATE"],"provenance":os.environ["PROVENANCE"],"finalize":os.environ["FINALIZE"]},indent=2,sort_keys=True)+"\n")'
      - name: Upload final signed certification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-certification-final-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
