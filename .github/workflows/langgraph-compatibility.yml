name: LangGraph compatibility

on:
  # Branches are covered by pull_request; the unrestricted push trigger ran this
  # a second time for the same commit. docs, examples and verify-extras already
  # scope push to main -- this and ci.yml were the two that did not.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: >-
      LangChain ${{ matrix.langchain }} / LangGraph ${{ matrix.langgraph }} /
      Agent Server ${{ matrix.langgraph_api }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - langchain: "1.3.14"
            langgraph: "1.2.9"
            langgraph_api: "0.11.1"
            langgraph_sdk: "0.4.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pinned compatibility versions
        run: >-
          uv run --frozen --group gateway-conformance python -c
          "from importlib.metadata import version;
          assert version('langchain') == '${{ matrix.langchain }}';
          assert version('langgraph') == '${{ matrix.langgraph }}';
          assert version('langgraph-api') == '${{ matrix.langgraph_api }}';
          assert version('langgraph-sdk') == '${{ matrix.langgraph_sdk }}'"

      - name: Run LangGraph gateway conformance
        run: >-
          uv run --frozen --group gateway-conformance pytest -o addopts= -q
          -m langgraph_conformance tests/langgraph_gateway/conformance
