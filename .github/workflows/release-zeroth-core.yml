name: Release zeroth-core

# Trusted-publisher OIDC release pipeline for zeroth-core.
# Triggered by GitHub Release `published` event. PKG-02/PKG-05/PKG-06.
#
# Stage order (per Phase 28 plan 03, D-12):
#   build -> smoke-install -> test-wheel -> publish-testpypi ->
#   smoke-from-testpypi -> publish-pypi
#
# Trusted publishers must be registered on pypi.org (env=pypi) AND
# test.pypi.org (env=testpypi) before this workflow can publish.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert git tag matches pyproject.toml version (D-07)
        shell: bash
        run: |
          set -euo pipefail
          PYPROJ_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject version: ${PYPROJ_VERSION}"
          echo "git tag version:   ${TAG_VERSION}"
          if [ "${PYPROJ_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml [project].version=${PYPROJ_VERSION}"
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Build sdist + wheel
        run: uv build

      - name: Set up Node (console build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build console static export + zeroth-console dist
        shell: bash
        run: |
          set -euo pipefail
          (cd frontend && npm ci --no-fund --no-audit && npm run build)
          ./scripts/build_console_dist.sh --skip-frontend-build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-install:
    name: Smoke-install built wheel
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Clean-venv install and import check
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python -c "import zeroth.core; print('zeroth.core path:', zeroth.core.__path__)"
          # Console dist: the bundled static export must resolve and mount.
          python -c "
          from zeroth.core.service.console_ui import find_console_dir
          d = find_console_dir()
          assert d is not None and (d / 'index.html').is_file(), f'console dir: {d}'
          print('zeroth-console static export OK:', d)
          "

  test-wheel:
    name: Run pytest against built wheel
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for tests/)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install wheel + test deps and run pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/test-venv
          source /tmp/test-venv/bin/activate
          pip install --upgrade pip
          # Install the built wheel with [all] so backend-dependent tests can import
          # their deps. testcontainers[postgres] is a dev/test-only dep (not in any
          # runtime extra) needed by the Docker-gated postgres backend tests, which
          # run on the Docker-enabled GitHub runner.
          pip install "$(ls dist/zeroth_core-*.whl)[all,langgraph]" pytest pytest-asyncio "testcontainers[postgres]"
          # Run the suite against the INSTALLED wheel, not src mode
          # -m "not live" respects the pyproject.toml marker convention
          pytest tests/ -v --no-header -ra -m "not live" --junitxml=release/langgraph/junit.xml

      - name: Upload JUnit release evidence
        uses: actions/upload-artifact@v4
        with:
          name: langgraph-junit
          path: release/langgraph/junit.xml

  publish-testpypi:
    name: Publish to TestPyPI (trusted publisher)
    needs: [smoke-install, test-wheel, container-evidence]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Sigstore attestations are default-on in v1.14+ (D-13)

  smoke-from-testpypi:
    name: Smoke-install from TestPyPI + run examples/00_hello.py
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout (for examples/00_hello.py)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from TestPyPI (retry loop for indexing lag) and run example
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Target version: ${VERSION}"
          python -m venv /tmp/testpypi-venv
          source /tmp/testpypi-venv/bin/activate
          pip install --upgrade pip
          # Retry loop — TestPyPI indexing can lag ~30-60s after publish (pitfall #4)
          INSTALLED=0
          for i in 1 2 3 4 5; do
            if pip install \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                "zeroth-core==${VERSION}" "zeroth-console==${VERSION}"; then
              INSTALLED=1
              break
            fi
            echo "TestPyPI install attempt ${i} failed; sleeping 15s..."
            sleep 15
          done
          if [ "${INSTALLED}" -ne 1 ]; then
            echo "::error::TestPyPI install failed after 5 attempts"
            exit 1
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY present — running examples/00_hello.py end-to-end"
            python examples/00_hello.py
          else
            echo "SKIP: no OPENAI_API_KEY available; skipping examples/00_hello.py"
          fi

  publish-pypi:
    name: Publish to PyPI (trusted publisher)
    needs: [smoke-from-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Default index, Sigstore attestations default-on in v1.14+ (D-13)

  container-evidence:
    name: Validate LangGraph container evidence
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ZEROTH_IMAGE_TAG: ${{ github.ref_name }}
      ZEROTH_SERVICE_API_KEYS_JSON: '[{"credential_id":"release-smoke","secret":"release-smoke-key","subject":"release-operator","roles":["operator"]}]'
      SIGNING_DEPLOYMENT: release-smoke-signing-key-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source release evidence
        run: python release/langgraph/harness.py validate --phase source --manifest release/langgraph/release-manifest.json

      - name: Download JUnit release evidence
        uses: actions/download-artifact@v4
        with:
          name: langgraph-junit
          path: release/langgraph

      - name: Build release image
        run: docker build -t zeroth-core:${{ github.ref_name }} .

      - name: Reject invalid configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm zeroth zeroth-core seed-demo
          set +e
          OUTPUT=$(timeout 15 docker compose run --rm \
            -e ZEROTH_DATABASE__BACKEND=invalid zeroth zeroth-core migrate 2>&1)
          STATUS=$?
          set -e
          if [ "${STATUS}" -eq 0 ] || [ "${STATUS}" -eq 124 ]; then
            echo "::error::invalid configuration did not fail promptly"
            exit 1
          fi
          if [[ "${OUTPUT}" != *"Input should be 'sqlite' or 'postgres'"* ]]; then
            echo "::error::invalid backend did not produce the exact validation diagnostic"
            exit 1
          fi

      - name: Readiness, gateway, and active shutdown smoke validation
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach --wait --no-build
          python release/langgraph/harness.py smoke --require-gateway
          python release/langgraph/harness.py gateway-smoke --api-key release-smoke-key
          python release/langgraph/harness.py gateway-smoke \
            --url http://127.0.0.1:8000/assistants/release-slow \
            --api-key release-smoke-key &
          REQUEST_PID=$!
          sleep 0.5
          docker compose stop --timeout 30 zeroth
          wait "${REQUEST_PID}"

      - name: Export image artifact
        run: docker save --output zeroth-core-image.tar zeroth-core:${{ github.ref_name }}

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: zeroth-core:${{ github.ref_name }}
          format: spdx-json
          output-file: release/langgraph/image.spdx.json

      - name: Record resolved image compatibility
        run: |
          python release/langgraph/harness.py image-evidence \
            --image zeroth-core:${{ github.ref_name }} \
            --image python:3.12.13-slim-bookworm \
            --image postgres:16.9-bookworm \
            --output release/langgraph/image-compatibility.json

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: zeroth-core-image.tar

      - name: Capture Sigstore provenance bundle
        run: cp "${{ steps.provenance.outputs.bundle-path }}" release/langgraph/provenance.bundle.json

      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-path: zeroth-core-image.tar
          sbom-path: release/langgraph/image.spdx.json

      - name: Validate generated release evidence
        run: python release/langgraph/harness.py validate --phase final --manifest release/langgraph/release-manifest.json

      - name: Upload reproducible container evidence
        uses: actions/upload-artifact@v4
        with:
          name: langgraph-container-evidence
          path: |
            zeroth-core-image.tar
            release/langgraph/image.spdx.json
            release/langgraph/image-compatibility.json
            release/langgraph/provenance.bundle.json
            release/langgraph/junit.xml
            release/langgraph/compatibility.json
            release/langgraph/benchmark-evidence.json
            release/langgraph/release-manifest.json
