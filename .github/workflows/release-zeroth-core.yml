name: Release zeroth-core

# Trusted-publisher OIDC release pipeline for zeroth-core.
# Triggered by GitHub Release `published` event. PKG-02/PKG-05/PKG-06.
#
# Stage order (per Phase 28 plan 03, D-12):
#   build -> smoke-install -> test-wheel -> publish-testpypi ->
#   smoke-from-testpypi -> publish-pypi
#
# Trusted publishers must be registered on pypi.org (env=pypi) AND
# test.pypi.org (env=testpypi) before this workflow can publish.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert git tag matches pyproject.toml version (D-07)
        shell: bash
        run: |
          set -euo pipefail
          PYPROJ_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject version: ${PYPROJ_VERSION}"
          echo "git tag version:   ${TAG_VERSION}"
          if [ "${PYPROJ_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml [project].version=${PYPROJ_VERSION}"
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Build sdist + wheel
        run: uv build

      - name: Set up Node (console build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build console static export + zeroth-console dist
        shell: bash
        run: |
          set -euo pipefail
          (cd frontend && npm ci --no-fund --no-audit && npm run build)
          ./scripts/build_console_dist.sh --skip-frontend-build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The four source-level gates, measured against the dist this run just built
  # rather than a second build of its own. Producing them here means a release
  # cannot promote on evidence that was only ever gathered nightly.
  source-gates:
    name: Source-level gates
    needs: [build]
    uses: ./.github/workflows/release-gates.yml
    with:
      dist_artifact: dist

  smoke-install:
    name: Smoke-install built wheel
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Clean-venv install and import check
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python -c "import zeroth.runtime; print('zeroth.runtime path:', zeroth.runtime.__path__)"
          # Console dist: the bundled static export must resolve and mount.
          python -c "
          from zeroth.service.api.console_ui import find_console_dir
          d = find_console_dir()
          assert d is not None and (d / 'index.html').is_file(), f'console dir: {d}'
          print('zeroth-console static export OK:', d)
          "

  test-wheel:
    name: Run pytest against built wheel
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for tests/)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install wheel + test deps and run pytest
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/test-venv
          source /tmp/test-venv/bin/activate
          pip install --upgrade pip
          # Install the built wheel with [all] so backend-dependent tests can import
          # their deps. testcontainers[postgres] is a dev/test-only dep (not in any
          # runtime extra) needed by the Docker-gated postgres backend tests, which
          # run on the Docker-enabled GitHub runner.
          pip install "$(ls dist/zeroth_core-*.whl)[all,langgraph]" pytest pytest-asyncio "testcontainers[postgres]"
          # Run the suite against the INSTALLED wheel, not src mode
          # -m "not live" respects the pyproject.toml marker convention
          pytest tests/ -v --no-header -ra -m "not live" --junitxml=release/langgraph/junit.xml

      - name: Upload JUnit release evidence
        uses: actions/upload-artifact@v4
        with:
          name: langgraph-junit
          path: release/langgraph/junit.xml

  # Nothing is published until every candidate-phase gate holds against this
  # exact candidate. Both promotion jobs depend on an evidence gate rather than
  # on the individual checks, so adding a gate to the manifest tightens
  # promotion automatically instead of needing this graph edited again.
  evidence-gate:
    name: Validate candidate evidence
    needs: [source-gates, smoke-install, test-wheel, container-evidence]
    # A gate that is skipped when a producer fails publishes no verdict and no
    # bundle -- exactly when the diagnosis is most needed. It still fails on a
    # blocking result, so promotion stays closed either way.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tolerant on purpose. `if: always()` only keeps the JOB alive; a
      # download that hard-fails because an upstream gate never uploaded would
      # still skip the verdict, which is exactly the run that needs one. A
      # record that never arrives is reported as `missing`, which blocks.
      - name: Collect every gate record
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: release/evidence
          merge-multiple: true

      - name: Download the full candidate identity
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity-full
          path: release/evidence

      - name: Validate and publish the candidate verdict
        shell: bash
        run: |
          set -uo pipefail
          python release/gates/cli.py verdict \
            --identity release/evidence/candidate-identity-full.json \
            --phase candidate \
            --output release/evidence/VERDICT-candidate.md; VERDICT=$?
          cat release/evidence/VERDICT-candidate.md >> "${GITHUB_STEP_SUMMARY}"
          exit "${VERDICT}"

      - name: Retain the candidate evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-candidate
          path: release/evidence
          retention-days: 90

  publish-testpypi:
    name: Publish to TestPyPI (trusted publisher)
    needs: [evidence-gate]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Sigstore attestations are default-on in v1.14+ (D-13)

  smoke-from-testpypi:
    name: Smoke-install from TestPyPI + run examples/00_hello.py
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout (for examples/00_hello.py)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The identity must be on disk before anything is compared against it.
      - name: Download the full candidate identity
        uses: actions/download-artifact@v4
        with:
          name: candidate-identity-full
          path: release/evidence

      - name: Install the published artifact and run the example
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Target version: ${VERSION}"
          python -m venv /tmp/testpypi-venv
          source /tmp/testpypi-venv/bin/activate
          pip install --upgrade pip
          mkdir -p release/evidence
          # Fetch the primary distributions from TestPyPI as the SOLE index.
          # `--extra-index-url` gives indexes no priority -- pip collects every
          # candidate and picks the best -- so resolving the primary dist across
          # both could install an existing same-version artifact from PyPI and
          # exercise a different build than the one just published.
          # Retry: TestPyPI indexing can lag ~30-60s after publish.
          DOWNLOADED=0
          for i in 1 2 3 4 5; do
            if pip download --no-deps --dest /tmp/rc-dist \
                --index-url https://test.pypi.org/simple/ \
                "zeroth-core==${VERSION}" "zeroth-console==${VERSION}"; then
              DOWNLOADED=1
              break
            fi
            echo "TestPyPI download attempt ${i} failed; sleeping 15s..."
            sleep 15
          done
          if [ "${DOWNLOADED}" -ne 1 ]; then
            echo "::error::TestPyPI download failed after 5 attempts"
            exit 1
          fi
          {
            echo "index: https://test.pypi.org/simple/ (sole index for the primary dists)"
            echo "requested-version: ${VERSION}"
            for dist in /tmp/rc-dist/*; do
              echo "accepted-artifact: $(basename "${dist}") sha256:$(shasum -a 256 "${dist}" | cut -d' ' -f1)"
            done
          } > release/evidence/remote-acceptance-log.txt
          # Refuse to go further unless those bytes are this candidate's.
          python - <<'PY' || { echo "::error::published artifact is not the candidate"; exit 1; }
          import json, pathlib, re
          identity = json.loads(
              pathlib.Path("release/evidence/candidate-identity-full.json").read_text()
          )
          expected = set(identity["package"]["artifacts"].values())
          log = pathlib.Path("release/evidence/remote-acceptance-log.txt").read_text()
          accepted = set(re.findall(r"accepted-artifact: \S+ (sha256:[0-9a-f]{64})", log))
          assert accepted, "no artifact was downloaded"
          unknown = accepted - expected
          assert not unknown, f"published artifact {unknown} is not among this candidate's {expected}"
          print("published artifacts match the candidate:", sorted(accepted))
          PY
          # Install exactly those verified files; PyPI serves dependencies only.
          pip install /tmp/rc-dist/* --extra-index-url https://pypi.org/simple/
          {
            echo "installed: $(pip show zeroth-core | sed -n 's/^Version: //p')"
            echo "console: $(pip show zeroth-console | sed -n 's/^Version: //p')"
          } >> release/evidence/remote-acceptance-log.txt
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY present — running examples/00_hello.py end-to-end"
            python examples/00_hello.py 2>&1 | tee -a release/evidence/remote-acceptance-log.txt
            echo "EXAMPLE_STATUS=passed" >> "${GITHUB_ENV}"
          else
            echo "SKIP: no OPENAI_API_KEY available; skipping examples/00_hello.py"
            echo "example: skipped, no OPENAI_API_KEY" >> release/evidence/remote-acceptance-log.txt
            echo "EXAMPLE_STATUS=failed" >> "${GITHUB_ENV}"
          fi

      - name: Record the remote-acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/evidence
          # A skipped example is not a passed one. Without the key the run has
          # not accepted the published artifact end to end, so the gate reports
          # failure and promotion to PyPI stays closed.
          python release/gates/cli.py record --gate remote-acceptance \
            --identity release/evidence/candidate-identity-full.json \
            --result index-install=passed \
            --result "example-run=${EXAMPLE_STATUS}" \
            --kind deployment=release/evidence/remote-acceptance-log.txt \
            --output release/evidence/remote-acceptance.json
          cat release/evidence/remote-acceptance.json

      - name: Upload remote-acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-remote-acceptance
          path: |
            release/evidence/remote-acceptance.json
            release/evidence/remote-acceptance-log.txt

  # The last gate before PyPI: every candidate gate, plus acceptance of the
  # artifact as actually published, plus a named human's recorded signoff.
  evidence-gate-final:
    name: Validate final evidence and promotion signoff
    needs: [evidence-gate, smoke-from-testpypi]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Tolerant on purpose. `if: always()` only keeps the JOB alive; a
      # download that hard-fails because an upstream gate never uploaded would
      # still skip the verdict, which is exactly the run that needs one. A
      # record that never arrives is reported as `missing`, which blocks.
      - name: Collect every gate record
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gate-*
          path: release/evidence
          merge-multiple: true

      - name: Download the full candidate identity
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-identity-full
          path: release/evidence

      - name: Record the promotion gate
        shell: bash
        run: |
          set -uo pipefail
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          SIGNOFF="release/signoff/${VERSION}.md"
          # No CI step can produce a signoff. When the operator has not written
          # one for this exact version the gate cannot cite it, and validation
          # reports the promotion gate as `partial` naming the absent file.
          # Nothing is written here on purpose: fabricating a placeholder so the
          # evidence "exists" is precisely the move this gate exists to stop.
          DIGEST=$(python release/gates/cli.py digest \
            --identity release/evidence/candidate-identity-full.json)
          SIGNOFF_STATUS=failed
          if [ ! -f "${SIGNOFF}" ]; then
            echo "::error::no operator signoff at ${SIGNOFF}"
          elif ! grep -q "${DIGEST}" "${SIGNOFF}"; then
            # A signoff that does not name this candidate is a signoff for some
            # other build. Existing is not the same as accepting *this* one.
            echo "::error::${SIGNOFF} does not name candidate ${DIGEST}"
          elif ! grep -qiE '^(signed-off-by|operator):' "${SIGNOFF}"; then
            echo "::error::${SIGNOFF} names no operator"
          else
            SIGNOFF_STATUS=passed
            mkdir -p release/evidence
            cp "${SIGNOFF}" release/evidence/promotion-signoff.md
          fi
          python release/gates/cli.py validate \
            --identity release/evidence/candidate-identity-full.json \
            --phase candidate > /dev/null; CANDIDATE=$?
          status() { if [ "$1" -eq 0 ]; then echo passed; else echo failed; fi; }
          python release/gates/cli.py record --gate promotion \
            --identity release/evidence/candidate-identity-full.json \
            --result "candidate-gates-validated=$(status ${CANDIDATE})" \
            --result "manual-signoff=${SIGNOFF_STATUS}" \
            --kind manual-signoff=release/evidence/promotion-signoff.md \
            --output release/evidence/promotion.json
          cat release/evidence/promotion.json

      - name: Validate and publish the final verdict
        shell: bash
        run: |
          set -uo pipefail
          python release/gates/cli.py verdict \
            --identity release/evidence/candidate-identity-full.json \
            --phase final \
            --output release/evidence/VERDICT.md; VERDICT=$?
          cat release/evidence/VERDICT.md >> "${GITHUB_STEP_SUMMARY}"
          # Seal regardless of the verdict: a blocked release still needs a
          # tamper-evident record of what was and was not proven.
          python release/gates/cli.py seal \
            --identity release/evidence/candidate-identity-full.json \
            --phase final \
            --output release/evidence/evidence-manifest.json
          exit "${VERDICT}"

      - name: Attest the evidence manifest
        if: always()
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          # Signs over the candidate identity and the digest of every gate
          # record, so the evidence itself carries an attestation rather than
          # only the image it describes.
          subject-path: release/evidence/evidence-manifest.json

      - name: Retain the final evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-final
          path: release/evidence
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI (trusted publisher)
    needs: [evidence-gate-final]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # Default index, Sigstore attestations default-on in v1.14+ (D-13)

  container-evidence:
    name: Validate LangGraph container evidence
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ZEROTH_IMAGE_TAG: ${{ github.ref_name }}
      ZEROTH_SERVICE_API_KEYS_JSON: '[{"credential_id":"release-smoke","secret":"release-smoke-key","subject":"release-operator","roles":["operator"]}]'
      SIGNING_DEPLOYMENT: release-smoke-signing-key-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Validate source release evidence
        run: python release/langgraph/harness.py validate --phase source --manifest release/langgraph/release-manifest.json

      - name: Download JUnit release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: langgraph-junit
          path: release/langgraph

      - name: Build release image
        run: docker build -t zeroth-core:${{ github.ref_name }} .

      - name: Compare image wheel with release candidate
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID=$(docker create zeroth-core:${{ github.ref_name }})
          trap 'docker rm -f "${CONTAINER_ID}" >/dev/null' EXIT
          mkdir -p /tmp/zeroth-image-wheel
          docker cp "${CONTAINER_ID}:/opt/zeroth/wheel/." /tmp/zeroth-image-wheel/
          DIST_WHEELS=(dist/zeroth_core-*.whl)
          IMAGE_WHEELS=(/tmp/zeroth-image-wheel/zeroth_core-*.whl)
          if [ "${#DIST_WHEELS[@]}" -ne 1 ] || [ ! -f "${DIST_WHEELS[0]}" ]; then
            echo "::error::expected exactly one release candidate wheel"
            exit 1
          fi
          if [ "${#IMAGE_WHEELS[@]}" -ne 1 ] || [ ! -f "${IMAGE_WHEELS[0]}" ]; then
            echo "::error::expected exactly one retained image wheel"
            exit 1
          fi
          cmp "${DIST_WHEELS[0]}" "${IMAGE_WHEELS[0]}"

      - name: Reject invalid configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm zeroth zeroth-core seed-demo
          set +e
          OUTPUT=$(timeout 15 docker compose run --rm \
            -e ZEROTH_DATABASE__BACKEND=invalid zeroth zeroth-core migrate 2>&1)
          STATUS=$?
          set -e
          if [ "${STATUS}" -eq 0 ] || [ "${STATUS}" -eq 124 ]; then
            echo "::error::invalid configuration did not fail promptly"
            exit 1
          fi
          if [[ "${OUTPUT}" != *"Input should be 'sqlite' or 'postgres'"* ]]; then
            echo "::error::invalid backend did not produce the exact validation diagnostic"
            exit 1
          fi

      - name: Readiness, gateway, and active shutdown smoke validation
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          docker compose up --detach --wait --no-build
          python release/langgraph/harness.py smoke --require-gateway
          python release/langgraph/harness.py gateway-smoke --api-key release-smoke-key
          python release/langgraph/harness.py gateway-smoke \
            --url http://127.0.0.1:8000/assistants/release-slow \
            --api-key release-smoke-key &
          REQUEST_PID=$!
          sleep 0.5
          docker compose stop --timeout 30 zeroth
          wait "${REQUEST_PID}"

      - name: Export image artifact
        run: docker save --output zeroth-core-image.tar zeroth-core:${{ github.ref_name }}

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: zeroth-core:${{ github.ref_name }}
          format: spdx-json
          output-file: release/langgraph/image.spdx.json

      - name: Record resolved image compatibility
        id: images
        shell: bash
        run: |
          set -euo pipefail
          python release/langgraph/harness.py image-evidence \
            --image zeroth-core:${{ github.ref_name }} \
            --image python:3.12.13-slim-bookworm \
            --image postgres:16.9-bookworm \
            --sbom release/langgraph/image.spdx.json \
            --artifact zeroth-core-image.tar \
            --output release/langgraph/image-compatibility.json
          IMAGE_DIGEST=$(python -c "import json; p=json.load(open('release/langgraph/image-compatibility.json')); print(next(i['digest'] for i in p['images'] if i['reference'].startswith('zeroth-core:')))")
          echo "digest=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Verify installed image package compatibility
        run: |
          python release/langgraph/harness.py image-packages \
            --image zeroth-core:${{ github.ref_name }} \
            --compatibility release/langgraph/compatibility.json \
            --image-evidence release/langgraph/image-compatibility.json \
            --output release/langgraph/image-packages.json

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: zeroth-core-image.tar

      - name: Capture Sigstore provenance bundle
        run: cp "${{ steps.provenance.outputs.bundle-path }}" release/langgraph/provenance.bundle.json

      - name: Cryptographically verify provenance attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify zeroth-core-image.tar \
            --bundle release/langgraph/provenance.bundle.json \
            --repo "$GITHUB_REPOSITORY" \
            --format json \
            > release/langgraph/attestation-verification.json

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: zeroth-core
          subject-digest: ${{ steps.images.outputs.digest }}
          sbom-path: release/langgraph/image.spdx.json

      - name: Validate generated release evidence
        run: python release/langgraph/harness.py validate --phase final --manifest release/langgraph/release-manifest.json

      - name: Measure the full candidate identity and record the deployment gate
        shell: bash
        run: |
          set -euo pipefail
          # Every preceding step in this job runs without `continue-on-error`,
          # so reaching this line means readiness, the gateway probe, the
          # invalid-configuration refusal, the shutdown drain, the SBOM and the
          # provenance verification all succeeded. If any had failed the job
          # would have stopped and no record would exist -- which the evidence
          # gate reports as `missing` and refuses to promote on.
          ARGS=()
          for artifact in dist/*; do
            ARGS+=(--artifact "$(basename "${artifact}")=${artifact}")
          done
          python release/gates/cli.py identity \
            "${ARGS[@]}" \
            --image "zeroth-core:${{ github.ref_name }}=${{ steps.images.outputs.digest }}" \
            --configuration docker-compose.yml \
            --compatibility release/langgraph/compatibility.json \
            --output release/evidence/candidate-identity-full.json
          # The cited files must travel with the record. These four are
          # generated by this job, not committed, so a validating job that only
          # checks the repository out would find them absent and refuse to
          # promote. Copy them under release/evidence so one artifact carries
          # the record and everything it cites, with a common root.
          cp release/langgraph/junit.xml release/evidence/deployment-junit.xml
          cp release/langgraph/image.spdx.json release/evidence/deployment-sbom.spdx.json
          cp release/langgraph/provenance.bundle.json \
            release/evidence/deployment-provenance.bundle.json
          cp release/langgraph/attestation-verification.json \
            release/evidence/deployment-attestation-verification.json
          python release/gates/cli.py record --gate deployment-smoke \
            --identity release/evidence/candidate-identity-full.json \
            --result readiness=passed \
            --result gateway=passed \
            --result invalid-configuration-refused=passed \
            --result active-shutdown=passed \
            --result sbom=passed \
            --result provenance-verified=passed \
            --kind deployment=release/evidence/deployment-junit.xml \
            --kind sbom=release/evidence/deployment-sbom.spdx.json \
            --kind provenance=release/evidence/deployment-provenance.bundle.json \
            --kind security=release/evidence/deployment-attestation-verification.json \
            --output release/evidence/deployment-smoke.json
          cat release/evidence/deployment-smoke.json

      - name: Upload the full candidate identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-identity-full
          path: release/evidence/candidate-identity-full.json

      - name: Upload deployment-smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Every path stays under release/evidence so the artifact root is
          # that directory; adding a path from elsewhere would move the common
          # ancestor and make the download land a directory deeper.
          name: gate-deployment-smoke
          path: release/evidence/deployment-*

      - name: Upload reproducible container evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: langgraph-container-evidence
          path: |
            zeroth-core-image.tar
            release/langgraph/image.spdx.json
            release/langgraph/image-compatibility.json
            release/langgraph/image-packages.json
            release/langgraph/provenance.bundle.json
            release/langgraph/attestation-verification.json
            release/langgraph/junit.xml
            release/langgraph/compatibility.json
            release/langgraph/benchmark-evidence.json
            release/langgraph/release-manifest.json
